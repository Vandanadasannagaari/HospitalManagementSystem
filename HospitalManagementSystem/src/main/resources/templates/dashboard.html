<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hospital Management - Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar"><h2>CarePoint Hospital</h2><div class="top-actions"><span>Management System</span><form th:action="@{/logout}" method="post"><button class="logout-btn" type="submit">Logout</button></form></div></header>
<div class="layout">
<nav class="sidebar">
    <a class="active" th:href="@{/}">Dashboard</a><a th:href="@{/patients}">Patients</a>
    <a th:href="@{/doctors}">Doctors</a><a th:href="@{/appointments}">Appointments</a><a th:href="@{/bills}">Billing</a>
</nav>
<main class="content">
    <h1>Dashboard</h1><p class="muted">Hospital overview</p>
    <section class="cards">
        <div class="stat"><span>Total Patients</span><strong th:text="${patientCount}">0</strong></div>
        <div class="stat"><span>Total Doctors</span><strong th:text="${doctorCount}">0</strong></div>
        <div class="stat"><span>Appointments</span><strong th:text="${appointmentCount}">0</strong></div>
        <div class="stat"><span>Generated Bills</span><strong th:text="${billCount}">0</strong></div>
    </section>
    <section class="panel"><h2>Quick actions</h2>
        <div class="actions"><a class="btn" th:href="@{/patients/new}">Register Patient</a>
        <a class="btn" th:href="@{/doctors/new}">Add Doctor</a>
        <a class="btn" th:href="@{/appointments/new}">Book Appointment</a>
        <a class="btn" th:href="@{/bills/new}">Create Bill</a></div>
    </section>
</main></div>
</body></html>
