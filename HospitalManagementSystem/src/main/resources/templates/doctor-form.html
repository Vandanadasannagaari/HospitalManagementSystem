
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="topbar">
        <h2>CarePoint Hospital</h2>
        <span>Doctor Registration</span>
    </header>

    <main class="form-page">
        <div class="panel form-panel">

            <h1 th:text="${doctor.id == null ? 'Add Doctor' : 'Update Doctor'}">
                Add Doctor
            </h1>

            <form th:action="@{/doctors/save}"
                  th:object="${doctor}" method="post">

                <input type="hidden" th:field="*{id}">

                <label>Doctor Name</label>
                <input type="text" th:field="*{name}"
                       required placeholder="Enter doctor name">

                <label>Specialization</label>
                <input type="text" th:field="*{specialization}"
                       required placeholder="e.g. Cardiologist">

                <label>Phone</label>
                <input type="text" th:field="*{phone}"
                       required placeholder="Phone number">

                <label>Email</label>
                <input type="email" th:field="*{email}"
                       placeholder="doctor@example.com">

                <div class="form-actions">
                    <button class="btn" type="submit">Save Doctor</button>
                    <a class="btn secondary" th:href="@{/doctors}">Cancel</a>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
