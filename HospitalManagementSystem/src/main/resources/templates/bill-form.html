
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Bill</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h2>CarePoint Hospital</h2>
    <span>Create Bill</span>
</header>

<main class="form-page">
    <div class="panel form-panel">
        <h1>Create Bill</h1>

        <form th:action="@{/bills/save}"
              th:object="${bill}" method="post">

            <label>Patient</label>
            <select th:field="*{patient}" required>
                <option value="">Select patient</option>
                <option th:each="p : ${patients}"
                        th:value="${p.id}"
                        th:text="${p.name}">
                </option>
            </select>

            <label>Description</label>
            <input type="text"
                   th:field="*{description}"
                   required
                   placeholder="Consultation / treatment">

            <label>Amount (INR)</label>
            <input type="number"
                   step="0.01"
                   min="0"
                   th:field="*{amount}"
                   required>

            <label>Bill date</label>
            <input type="date" th:field="*{billDate}">

            <label>Payment status</label>
            <select th:field="*{paymentStatus}">
                <option value="PENDING">PENDING</option>
                <option value="PAID">PAID</option>
            </select>

            <div class="form-actions">
                <button class="btn" type="submit">Save Bill</button>
                <a class="btn secondary" th:href="@{/bills}">Cancel</a>
            </div>

        </form>
    </div>
</main>

</body>
</html>
